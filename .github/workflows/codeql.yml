name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 05:17 UTC. Catches advisory-database additions
    # against unchanged code between active development bursts.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: manual

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: codeql-${{ matrix.language }}

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Manual build: CodeQL Rust analysis needs the same compile path
      # as `cargo build`, with the same C-build deps the binary's
      # aws-lc-rs pull requires (mirrors release.yml::build).
      - name: Build workspace
        run: cargo build --workspace --locked

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
