name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

# Workflow-level default. Only the `release` job (which creates the
# GH draft) and the `docker` job (which pushes to ghcr.io) need write
# scopes — both already declare them explicitly. Everything else is
# read-only and inherits this minimal default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Opt third-party JS actions onto Node 24 ahead of GitHub's
  # 2026-06-02 default flip. Becomes a no-op once Node 24 is default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.target }})
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_suffix: x86_64-linux
            ext: tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_suffix: aarch64-linux
            ext: tar.gz
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: aarch64-apple-darwin
            ext: tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: x86_64-pc-windows-msvc
            ext: zip
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version; reproducible release artefacts
      # are defined by (commit, target triple, rustc version), so the channel
      # must not float.
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # cross provides a docker image with aarch64-musl-cross + cmake +
      # clang, which keeps aws-lc-rs's C build happy without the apt
      # toolchain dance. If cross ever churns on aws-lc-rs, the
      # documented fallback is to switch the rustls feature flag in
      # `Cargo.toml` from `aws_lc_rs` to `ring` for release builds —
      # one call site (`crates/rtsp/src/server/tls.rs::install_*`).
      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # aws-lc-rs on Windows pulls in a C build that needs NASM and
      # libclang. CMake and LLVM are preinstalled on windows-latest;
      # NASM comes from chocolatey. LIBCLANG_PATH points the bindgen
      # crate at the preinstalled LLVM.
      - name: Install Windows build tools (NASM + LIBCLANG_PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y nasm
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
          Add-Content -Path $env:GITHUB_ENV -Value 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'

      # Path-scrub for reproducibility: rewrite the cargo registry and
      # workspace paths that otherwise leak into panic strings + any
      # residual debug info. `strip = "symbols"` already removes the
      # bulk; this closes the panic-message gap. Switch to the Cargo
      # `trim-paths` profile key when it stabilises.
      - name: Set reproducible RUSTFLAGS (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Both host paths (native cargo) and cross's container paths
          # (/project workspace, /root/.cargo home) — rustc silently
          # ignores remap patterns that don't match the actual source.
          echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$PWD=/build --remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/project=/build" >> "$GITHUB_ENV"

      - name: Set reproducible RUSTFLAGS (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $pwdPath = (Get-Location).Path
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=--remap-path-prefix=$cargoHome=/cargo --remap-path-prefix=$pwdPath=/build"

      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --locked --release --target ${{ matrix.target }} --bin bairelay

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin bairelay

      # Stripping happens in-build via `[profile.release] strip = "symbols"`
      # in Cargo.toml — uniform across every target, and avoids the
      # x86_64-host vs aarch64-binary mismatch on the cross cell.

      - name: Package archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          dir="bairelay-${GITHUB_REF_NAME}-${{ matrix.archive_suffix }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/bairelay" "$dir/"
          cp README.md LICENSE CHANGELOG.md sample_config.toml "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $dir = "bairelay-$env:GITHUB_REF_NAME-${{ matrix.archive_suffix }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\bairelay.exe" "$dir\"
          Copy-Item README.md, LICENSE, CHANGELOG.md, sample_config.toml "$dir\"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$dir.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: bairelay-${{ matrix.archive_suffix }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all archives
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Extract the section between '## [X.Y.Z]' and the next '## ['
      # heading. Empty result falls back to a one-line placeholder so
      # the operator is never blocked by a missing CHANGELOG entry.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Release ${GITHUB_REF_NAME}." > release-notes.md
          fi
          echo "Notes preview:"
          head -40 release-notes.md

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Bairelay ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  docker:
    name: docker (${{ matrix.target.arch }})
    if: github.event_name == 'release' && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: amd64
            platform: linux/amd64
            tarball_suffix: x86_64-linux
          - arch: aarch64
            platform: linux/arm64
            tarball_suffix: aarch64-linux
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version + SHAs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "v${VERSION}" \
            --pattern '*x86_64-linux.tar.gz' \
            --pattern '*aarch64-linux.tar.gz' \
            --pattern 'SHA256SUMS' \
            --dir dist/
          SHA_AMD64=$(awk '/x86_64-linux\.tar\.gz$/{print $1}' dist/SHA256SUMS)
          SHA_AARCH64=$(awk '/aarch64-linux\.tar\.gz$/{print $1}' dist/SHA256SUMS)
          echo "BAIRELAY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA_AMD64=$SHA_AMD64" >> "$GITHUB_ENV"
          echo "SHA_AARCH64=$SHA_AARCH64" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (${{ matrix.target.arch }})
        uses: docker/build-push-action@v6
        with:
          context: hassio/bairelay
          platforms: ${{ matrix.target.platform }}
          push: true
          tags: |
            ghcr.io/mgc8/bairelay-hassio-${{ matrix.target.arch }}:${{ env.BAIRELAY_VERSION }}
            ghcr.io/mgc8/bairelay-hassio-${{ matrix.target.arch }}:latest
          build-args: |
            BAIRELAY_VERSION=${{ env.BAIRELAY_VERSION }}
            BAIRELAY_SHA256_AMD64=${{ env.SHA_AMD64 }}
            BAIRELAY_SHA256_AARCH64=${{ env.SHA_AARCH64 }}

  publish-crates:
    name: publish to crates.io
    if: github.event_name == 'release' && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      # The binary's verify-compile needs the same C build chain as the
      # release matrix's x86_64-linux-musl cell, since aws-lc-rs (pulled
      # via rustls 0.23) compiles C inline. Mirror what release.yml::build
      # installs for that cell.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Publish bairelay to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --yes
