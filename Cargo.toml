[package]
name = "bairelay"
# Single source of truth for the version. `scripts/release.sh` rewrites
# this line; `hassio/bairelay/config.yaml` is bumped in lockstep.
version = "1.1.2"
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mgc8/bairelay"
homepage = "https://github.com/mgc8/bairelay"
keywords = ["reolink", "rtsp", "mqtt", "baichuan", "home-assistant"]
categories = ["multimedia::video", "network-programming"]
description = "RTSP Relay for Reolink Baichuan cameras"
readme = "README.md"

# Trim the .crate for crates.io users. Everything below is dev/repo
# infrastructure or distributed via separate channels (HAOS add-on
# via ghcr.io). `cargo install bairelay` only needs src/, the
# integration tests, and the operator-facing docs.
exclude = [
	"/.github/",
	"/.gitignore",
	"/codecov.yml",
	"/hassio/",
	"/repository.yaml",
	"/rust-toolchain.toml",
	"/rustfmt.toml",
	"/scripts/",
	"/tarpaulin.toml",
	"/tests/fixtures/",
	"/tests/ha-token",
	"/tests/logs/",
	"/tests/scripts/",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full", "tracing"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bytes = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ab_glyph = "0.2"
time = { version = "0.3", features = ["macros", "parsing", "formatting", "local-offset"] }

# ── Baichuan protocol (src/baichuan) ──────────────────────────────────
aes = "0.8.2"
cfb-mode = "0.8.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
cookie-factory = "0.3.2"
crc32fast = "1.3.2"
crossbeam-channel = "0.5.8"
delegate = "0.12.0"
get_if_addrs = "0.5.3"
md5 = "0.7.0"
nom = { version = "7.1.3", features = ["alloc"] }
rand = "0.8.5"
zeroize = "1.8"
tokio-stream = { version = "0.1.12", features = ["sync", "time", "net"] }
# Cloud bundle minting for account ("cloud") cameras: HTTPS to
# apis.reolink.com. rustls-tls (no OpenSSL) + gzip + json.
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"gzip",
	"json",
	"charset",
	"http2",
] }

# ── RTSP server (src/rtsp) ────────────────────────────────────────────
rtsp-types = "0.1"
rtp-types = "0.1"
sdp-types = "0.1"
subtle = "2"
tokio-rustls = "0.26"

# ── MQTT bridge (src/mqtt) ────────────────────────────────────────────
rumqttc = "0.25"
base64 = "0.22"

rustls = "0.23"
rustls-pemfile = "2"
# No-echo TTY input + plain-stdin read for `users add` / `users password`
# when the operator omits the password positional. Keeps the secret out
# of `ps auxww`, shell history, and supervisor argv-capture logs.
rpassword = "7"

# Strip symbols from release builds via rustc itself, not a post-build
# `strip` step. The cross-compile aarch64-musl release matrix cell can't
# rely on the runner's host `strip` (x86_64 only), and asking cargo to
# do it is uniform across every target and Cargo profile-aware. Keep
# `strip = "symbols"` (not `"debuginfo"`) — the release artifact is for
# operators, not core dumps; debug-mode local builds keep full info.
#
# Release artefact path scrubbing happens via `--remap-path-prefix` in
# `release.yml` (stable rustc flag). The unified `trim-paths` profile
# key is still unstable in Cargo 1.95 — revisit when it stabilises.
[features]
# Exposes the in-process protocol test scaffolding (`MockConnection*`,
# `BcCamera::from_mock_connection`, `BcCamera::test_set_ability`,
# `MotionData::test_new`) to the integration tests in `tests/`. Off by
# default so a release build cannot substitute a scripted connection for
# a real camera. Unit tests inside `src/` see it via `cfg(test)`.
test-util = []

# Exposes `baichuan::fuzz_api`: public shims around otherwise
# `pub(crate)` parsers (`Bc::deserialize`, `BcXml::try_parse`) so the
# out-of-tree `fuzz/` project (libfuzzer-sys, nightly) can drive them.
fuzz-api = []

# Exposes `baichuan::pcap_decode_api` with the offline-decoder
# primitives (`Session`, `Direction`) that `tests/scripts/decode-bc-pcap`
# drives against a captured BcUdp session. Debugging-only surface.
pcap-decode-api = []

[profile.release]
strip = "symbols"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rcgen = "0.13"

assert_matches = "1.5.0"
indoc = "2.0.1"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Self-dependency purely to switch on `test-util` when building the
# integration tests in `tests/`. Those link the library as an external
# consumer, so `cfg(test)` does not reach them and the protocol test
# scaffolding would otherwise be absent. Production builds are
# unaffected — the feature stays off.
bairelay = { path = ".", features = ["test-util"] }

# tests/fixture_replay.rs drives the real RtspServer::serve over a TCP
# socket and hand-parses RTP/RTCP bytes off the wire. That requires
# tokio's net + io-util feature flags (not pulled in by the runtime
# crate's default feature set). `test-util` enables the virtual-time
# clock (`tokio::time::advance`, `start_paused = true`) used by the
# gap-detection unit tests.
tokio = { version = "1", features = ["full", "test-util"] }

[[bench]]
name = "rtp_packetizer"
harness = false

[[bench]]
name = "last_frame_buffer"
harness = false
