[package]
name = "bairelay_rtsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust RTSP server primitives for bairelay"

[dependencies]
async-trait = "0.1"
thiserror = "2"
bytes = "1"
rtsp-types = "0.1"
rtp-types = "0.1"
sdp-types = "0.1"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util", "rt-multi-thread"] }
rcgen = "0.13"
# Property tests: fuzz codec parsers (NAL whitelist, AAC ADTS) with
# arbitrary byte input; the contract is "no panic for any input".
proptest = "1"
# Benchmarks: pin throughput regressions on hot-path packetizers and
# the last-frame buffer. Run with `cargo bench -p bairelay_rtsp`.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rtp_packetizer"
harness = false

[[bench]]
name = "last_frame_buffer"
harness = false
