# Test mosquitto config — runs inside a docker container on colima
# alongside HA. Bind-mounted into the container at
# /mosquitto/config/mosquitto.conf. Lifecycle: ha-up.sh starts the
# container, ha-down.sh stops it. Both bairelay (on the macOS host)
# and HA (in colima with --network=host) reach it on 127.0.0.1:1884.
#
# Port 1884 (not 1883) avoids colliding with any other mosquitto a
# developer may already be running.
#
# allow_anonymous=false + password_file: bairelay's MQTT bridge
# requires credentials. Password file is bind-mounted alongside.

listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Match bairelay's `set_max_packet_size(16 MiB)` on the rumqttc side.
# A 4K HEVC preview JPEG re-encoded as base64 lands around 2 MiB and
# mosquitto 2.x defaults to a tighter packet ceiling, which manifests
# as `disconnected: oversize packet` and a tight reconnect loop.
max_packet_size 16777216
message_size_limit 16777216
